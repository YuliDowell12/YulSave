<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YulSave</title>
  </head>
  <body>
    <header>
      <h1>YulSave</h1>
      <p>
        Track your recurring subscriptions | Catch forgotten free trials before
        they charge you
      </p>
    </header>

    <main>
      <section id="summary">
        <h2>Summary</h2>
        <p>
          Total monthly recurring spend:
          <strong id="total-monthly">$0.00</strong>
        </p>
        <p>Active subscriptions: <strong id="active-count">0</strong></p>
      </section>

      <section id="renewals">
        <h2>Renewing in the next 30 days</h2>
        <ul id="renewal-list">
          <li>No upcoming renewals yet.</li>
        </ul>
      </section>

      <section id="add-subscription">
        <h2>Add a subscription</h2>
        <form id="subscription-form">
          <label for="name">Name</label>
          <input type="text" id="name" required />

          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" min="0" step="0.01" required />

          <label for="frequency">Billing frequency</label>
          <select id="frequency">
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>

          <label for="renewal-date">Next renewal date</label>
          <input type="date" id="renewal-date" required />

          <label>
            <input type="checkbox" id="is-trial" /> This is a free trial
          </label>

          <div id="trial-field" hidden>
            <label for="trial-end">Trial end date</label>
            <input type="date" id="trial-end" />
          </div>

          <button type="submit">Add subscription</button>
        </form>
      </section>

      <section id="subscriptions">
        <h2>All subscriptions</h2>
        <ul id="subscription-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
